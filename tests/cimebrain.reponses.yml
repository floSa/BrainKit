# ==============================================================================
# cimebrain.reponses.yml — les REPONSES d un entretien joue en entier, sur un
# TROISIEME sujet : ni le dev, ni l histoire.
# ------------------------------------------------------------------------------
# Sujet : la montagne — les courses qu on grimpe, ce qu elles demandent, et ce
# qu on a compris de la technique. Choisi parce qu il eloigne de deux facons a
# la fois :
#
#   · l unite n est ni un OUTIL (dev) ni une SOURCE (histoire), c est un
#     ITINERAIRE — une chose qu on fait, pas une chose qu on lit ni qu on
#     installe ;
#   · l axe qui range n est ni un domaine ni une periode, c est un MASSIF, et
#     il est presque exclusif : les traversees le cassent, et c est la que le
#     mecanisme non exclusif se rejoue sur un cas qui n a rien a voir avec les
#     syntheses de longue duree de HistoBrain.
#
# Ce fichier est la TRANSCRIPTION des reponses, pas le manifeste. Le manifeste
# s en compose :
#
#     uv run brainkit entretien --brouillon <b.yml> --reponses tests/cimebrain.reponses.yml
#     uv run brainkit entretien --brouillon <b.yml> --composer brain.yml
#
# La conversation qui a produit ces reponses est transcrite dans
# `design/06-entretien.md` §4 — avec ce que l entretien a REFUSE d y ajouter.
# ==============================================================================

reponses:

  # --- Passe 0 — identite et depot ---------------------------------------- #
  "0.1": >-
    Ce que je grimpe et ce que je veux grimper : les courses de montagne, ce
    qu'elles demandent, et ce que j'ai compris de la technique.
  "0.2": CimeBrain
  "0.3": perso
  "0.4":
    name: floSa
    email: florian_horellou@laposte.net
  "0.5": [aosis.net]
  "0.6": "C:/Users/FlorianHorellou/Documents/BrainKit-essais/cimebrain"

  # --- Passe 1 — l unite --------------------------------------------------- #
  "1.1": >-
    Je vais chercher quoi faire ce week-end : quelque chose que je peux tenir
    avec le niveau que j'ai, à la saison qu'il fait, dans un massif où je peux
    aller.
  "1.2": { s: course, p: courses }
  "1.3":
    s: technique
    p: techniques
    protege: true
  "1.4": [technique]
  "1.5":
    - libelle: { s: règle, p: règles }
      dossier: "Règles"
      prefixe_nom: "Règle - "
      champs: [portee, fermete]

  # --- Passe 2 — l axe qui range ------------------------------------------- #
  "2.1":
    - "Mont Blanc par les Trois Monts"
    - "Arête des Cosmiques"
    - "Éperon des Cosmiques"
    - "Aiguille du Tour par le glacier du Trient"
    - "Barre des Écrins par le glacier Blanc"
    - "Dôme de Neige des Écrins"
    - "Traversée de la Meije"
    - "Grande Casse par les Grands Couloirs"
    - "Aiguille de Péclet à ski"
    - "Dent Parrachée par la voie normale"
    - "Tour de la Vanoise"
    - "Mont Aiguille par la voie normale"
    - "Grande Moucherolle à ski"
    - "Grand Veymont par les crêtes"
    - "Vignemale par le glacier d'Ossoue"
    - "Pic du Midi d'Ossau par la voie normale"
    - "Brèche de Roland depuis Gavarnie"
    - "Formes du Chaos - cascade de Ceillac"
    - "Aiguille de Chambeyron par l'arête sud"
    - "Grande Traversée des Alpes"

  # Le rangement, DE SA MAIN. Sept paquets, nommes par lui, dans l ordre ou il
  # les a nommes — du nord au sud, puis les traversees, qu il a creees en
  # dernier pour la vingtieme page.
  "2.2":
    Mont-Blanc:
      - "Mont Blanc par les Trois Monts"
      - "Arête des Cosmiques"
      - "Éperon des Cosmiques"
      - "Aiguille du Tour par le glacier du Trient"
      - "Grande Traversée des Alpes"
    Écrins:
      - "Barre des Écrins par le glacier Blanc"
      - "Dôme de Neige des Écrins"
      - "Traversée de la Meije"
      - "Grande Traversée des Alpes"
    Vanoise:
      - "Grande Casse par les Grands Couloirs"
      - "Aiguille de Péclet à ski"
      - "Dent Parrachée par la voie normale"
      - "Tour de la Vanoise"
      - "Grande Traversée des Alpes"
    Vercors:
      - "Mont Aiguille par la voie normale"
      - "Grande Moucherolle à ski"
      - "Grand Veymont par les crêtes"
    Pyrénées:
      - "Vignemale par le glacier d'Ossoue"
      - "Pic du Midi d'Ossau par la voie normale"
      - "Brèche de Roland depuis Gavarnie"
    Queyras-Ubaye:
      - "Formes du Chaos - cascade de Ceillac"
      - "Aiguille de Chambeyron par l'arête sud"
    Traversées:
      - "Tour de la Vanoise"
      - "Grande Traversée des Alpes"

  "2.3": non
  "2.4":
    regle_de_majorite: true
    prefixe_transversal: "Traversées"
    motif: >-
      Le Tour de la Vanoise déborde mais a un centre de gravité — il ne quitte
      jamais le massif, la règle de majorité suffit. La Grande Traversée des
      Alpes n'en a aucun : elle va du Léman à la Méditerranée, et la ranger dans
      le Mont-Blanc parce qu'elle y passe serait un mensonge dans le champ.
  "2.5": { s: massif, p: massifs }
  "2.6": 600
  "2.7":
    ordre_de_l_utilisateur: true
    branches:
      - n: D1
        question: "La course enjambe-t-elle plus de deux massifs, sans qu'aucun ne domine ?"
        si_oui: [traversees]
        motif: >-
          HORS géographie, et EN PREMIER — c'est le rang qui compte. Sans elle,
          la Grande Traversée des Alpes tomberait dans le premier massif qu'elle
          touche, c'est-à-dire au hasard du sens de lecture.
      - { n: D2, question: "Est-elle dans le massif du Mont-Blanc ?", si_oui: ["mont-blanc/*"] }
      - { n: D3, question: "Est-elle dans les Écrins ?",             si_oui: ["ecrins/*"] }
      - { n: D4, question: "Est-elle en Vanoise ?",                  si_oui: ["vanoise"] }
      - { n: D5, question: "Est-elle dans le Vercors ?",             si_oui: ["vercors"] }
      - { n: D6, question: "Est-elle dans les Pyrénées ?",           si_oui: ["pyrenees/*"] }
      - { n: D7, question: "Est-elle dans le Queyras ou l'Ubaye ?",  si_oui: ["queyras-ubaye"] }
      - n: D8
        question: "Aucun des précédents"
        si_oui: []
        arret: true
        motif: "ARRÊT — demander. Un massif manquant ne s'invente jamais : il se nomme."

  # --- Passe 3 — l axe qui qualifie ---------------------------------------- #
  "3.1": oui
  "3.2":
    champ: terrain
    libelle: { s: terrain, p: terrains }
    valeurs:
      - cle: rocher
        definition: "Le rocher porte la difficulté."
        frontiere: "Distinct de mixte parce qu'on ne chausse pas les crampons dans les longueurs."
      - cle: neige
        definition: "Pente de neige, crampons et piolet."
        frontiere: "Distincte de glace parce qu'il n'y a pas de glace vive : le piolet plante, il ne s'ancre pas."
      - cle: glace
        definition: "Glace vive ou glacier crevassé."
        frontiere: "Distincte de cascade parce que la glace est permanente, pas un écoulement de saison."
      - cle: mixte
        definition: "Rocher et glace dans la même longueur."
        frontiere: "Distinct de rocher ET de glace : ce qui le définit est qu'on ne déchausse pas les crampons pour grimper."
      - cle: ski
        definition: "L'itinéraire se parcourt skis aux pieds."
        frontiere: "Distinct de tout le reste par le MOYEN, pas par le terrain — c'est la seule valeur de l'axe qui décrive un mode de déplacement, et c'est assumé."
      - cle: randonnee
        definition: "Aucun matériel technique ; la difficulté est l'effort et l'orientation."
        frontiere: "Distincte de neige par l'absence de crampons, et c'est le seul fait vérifiable qui les sépare."
      - cle: cascade
        definition: "Écoulement gelé, saisonnier, coté à part."
        frontiere: "Distincte de glace par la saisonnalité : elle n'existe pas tous les ans, et pas au même moment."
  "3.3":
    ordre_de_l_utilisateur: true
    branches:
      - { n: N1, question: "Se parcourt-elle skis aux pieds ?",                          si_oui: ski }
      - { n: N2, question: "La glace est-elle un écoulement gelé de saison ?",           si_oui: cascade }
      - { n: N3, question: "Rocher et glace se mêlent-ils dans la même longueur ?",      si_oui: mixte }
      - { n: N4, question: "Y a-t-il de la glace vive ou un glacier à traverser ?",      si_oui: glace }
      - { n: N5, question: "Faut-il crampons et piolet dans une pente de neige ?",       si_oui: neige }
      - { n: N6, question: "Y a-t-il des longueurs d'escalade cotées ?",                 si_oui: rocher }
      - { n: N7, question: "Aucun des précédents", si_oui: randonnee, defaut: true }
  "3.4":
    - { champ: cotation_glace, si: "terrain in [glace, mixte, cascade]" }
    - { champ: pente_max,      si: "terrain == ski" }

  # --- Passe 4 — les axes transverses -------------------------------------- #
  # UN seul axe, et pas deux : « la difficulté » a été proposée par
  # l'utilisateur puis retirée par lui — c'est déjà un champ (`cotation`), et un
  # champ n'est pas un axe. Cf. `design/06-entretien.md` §4, passe 4.
  "4.1":
    - champ: saisons
      libelle: { s: saison, p: saisons }
      valeurs:
        - { cle: hiver,      libelle: "Hiver" }
        - { cle: printemps,  libelle: "Printemps" }
        - { cle: ete,        libelle: "Été" }
        - { cle: automne,    libelle: "Automne" }
  "4.2": { saisons: true }
  "4.3": { saisons: "Saisons" }

  # --- Passe 5 — le haut de page ------------------------------------------- #
  "5.1": ["Terrain", "Cotation", "Dénivelé et durée", "Engagement"]
  "5.2":
    Terrain:
      source: terrain
      table:
        rocher: Rocher
        neige: Neige
        glace: Glace
        mixte: Mixte
        ski: Ski
        randonnee: Randonnée
        cascade: Cascade
    Cotation:
      source: cotation
      type: ligne
    "Dénivelé et durée":
      source: denivele
      qualifie_par: duree
      type: ligne
    Engagement:
      source: engagement
      type: enum
      valeurs: [faible, moyen, fort, tres-fort]
  "5.3": "—"

  # --- Passe 6 — le corps --------------------------------------------------- #
  "6.1":
    - { titre: "Ce que c'est",                    niveau: 2 }
    - { titre: "Ce qui passe / Ce qui ne passe pas", niveau: 2 }
    - { titre: "Sur place",                       niveau: 2 }
    - { titre: "Autour",                          niveau: 2 }
    - { titre: "Variante de",                     niveau: 3 }
    - { titre: "Variantes",                       niveau: 3 }
    - { titre: "S'enchaîne avec",                 niveau: 3 }
    - { titre: "Voir aussi",                      niveau: 2 }
    - titre: "Sorties"
      niveau: 2
      existe_si: "au moins une sortie datée"
      forme: "- YYYY-MM-DD — <conditions trouvées, ce qui a joué>."
  "6.2": "Ce que c'est"
  "6.3":
    titre: "Ce qui passe / Ce qui ne passe pas"
    positive: "Ça passe"
    negative: "Ça ne passe pas"
  "6.4":
    - { titre: "Variante de",     niveau: 3, champ: variante_de }
    - { titre: "Variantes",       niveau: 3, champ: variantes }
    - { titre: "S'enchaîne avec", niveau: 3, champ: enchaine_avec }
    - { titre: "Voir aussi",      niveau: 2, champ: null }
  "6.5":
    titre: "Sur place"
    obligatoires: ["Accès", "Refuge", "Matériel", "Créneau"]
    permises: ["Accès", "Refuge", "Matériel", "Créneau"]

  # --- Passe 7 — les liens et le resume ------------------------------------- #
  "7.1":
    - { champ: enchaine_avec, section: "S'enchaîne avec" }
    - { champ: variante_de,   section: "Variante de" }
  "7.2":
    enchaine_avec: true
    variante_de: false
  "7.3":
    variante_de:
      champ: variantes
      section: "Variantes"
  "7.4": { champ: resume }

  # --- Passe 8 — ce qui rassemble ------------------------------------------- #
  "8.1": non
  "8.2":
    libelle: { s: sélection, p: sélections }
    prefixe_nom: "Sélection - "
    tri_par: cotation
    direction: asc
    colonnes: [nom, resume, terrain, cotation, denivele, saisons]
  "8.3":
    dossier: "Sélections"
    lien_retour: "Voir aussi"

  # --- Passe 9 — gouvernance et frontieres ---------------------------------- #
  "9.1": ferme
  "9.2": demander
  "9.3": non
  "9.4":
    - "AI/index/"
    - "les zones AUTO des hubs"
    - "Saisons/"
    - "Sélections/Sélections.md"
    - "les bandeaux des courses"
    - "Documentation/massifs/taxonomie.md"
    - "Templates/"
  "9.5":
    porte_d_entree: Home.md
    pages:
      - { fichier: Home.md,  titre: Accueil, aiguille: true,  role_editorial: porte }
      - { fichier: Inbox.md, titre: Inbox,   aiguille: false, role_editorial: capture }
  "9.6":
    - chemin: "Carnet/"
      role_editorial: atelier
      motif: >-
        Demandé explicitement : les comptes rendus bruts de sortie, écrits le
        soir même, avant d'en tirer quoi que ce soit. Ce ne sont pas des pages
        du brain — ils ne portent ni rôle ni catégorie — donc le dossier est
        dans `genere.non_pages` et le validateur ne le lit pas.

  # --- Passe 10 — l exploitation --------------------------------------------- #
  "10.1": >-
    Une fiche de course prête à partir : l'itinéraire, le matériel, les créneaux
    possibles, et ce qu'on fait si ça ne passe pas.
  "10.2":
    - "sortie à la journée"
    - "week-end avec une nuit en refuge"
    - "raid de plusieurs jours"
  "10.3":
    - "quel niveau, et quelle expérience de ce terrain-là ?"
    - "quelle saison, et quel créneau météo ?"
    - "combien de jours, avec ou sans refuge ?"
    - "seul, à deux, ou en groupe ?"
