  vue_min_membres: 2              # check_brain.BASE_MIN_MEMBRES
  motif: "Au-dessous, une valeur de l'axe n'a pas assez de membres pour qu'une vue ait un sens."

vocabulaires:
  tags:
    fichier: "Documentation/general/tags.md"
    mode: ferme
    lecture: "colonne 1 des tableaux, en backticks, kebab-case"
    regle: >
      Le skill pioche, il n invente JAMAIS. Un tag manquant se propose, s ajoute
      ici, puis s utilise.
  themes:
    fichier: "Documentation/general/themes.md"
    mode: ferme
    lecture: "colonne 1 des tableaux, en backticks"
    porte: "axes.transverses[domaines]"
  taxonomie:
    fichier: "Documentation/general/taxonomie.md"
    mode: ferme
    lecture: "bloc ```famille pour l'axe de nature ; bloc ```domaine et fences nus pour l'axe de rangement"
    genere: true
    motif: >
      Dans DevBrain, ce fichier est la source MACHINE lue par le validateur.
      Dans BrainKit il devient un document GENERE depuis le manifeste : la place
      du vocabulaire ferme devient le manifeste, et deux sources ne decrivent plus
      la meme chose (motif E4).
    motif_du_fence_par_langue: >
      La langue du fence separe les vocabulaires : ```famille porte l axe nature,
      un fence nu porte l axe de rangement. Sans cette distinction, le chargeur
      avalerait les 9 valeurs de famille et `categorie: paquet` deviendrait valide.

graphe:
  cible: ".obsidian/graph.json, clé `colorGroups`"
  versionne: false
  motif_non_versionne: >
    `.obsidian/graph.json` est GITIGNORE : cette table est la SEULE source de
    verite des couleurs, a reappliquer a la main sur chaque poste. C est une etape
    d installation, pas un fichier. L extrait CSS `.obsidian/snippets/roles.css`,
    lui, est versionne — il colore l explorateur, les onglets et le badge de
    propriete, pas le graphe.
  motif_de_l_ordre: >
    L ordre compte : une requete `path:` passe AVANT une requete `role:`, sinon un
    hub special prend la couleur des hubs ordinaires. `path:Comparatifs/` est en
    tete parce que ce n est pas un aiguillage de dossier parmi d autres, c est le
    point de ralliement des 47 : en orange il se confondait avec les 46 hubs de
    l arbre et devenait introuvable a l oeil (arbitrage du 2026-09-06).
  ordre:
    - { requete: "path:Comparatifs/",  couleur: "#EF4444", rgb: 15680580 }
    - { requete: "path:Métiers/",      couleur: "#FFD43B", rgb: 16766011 }
    - { requete: '["role":"hub"]',        couleur: "#FF922B", rgb: 16749099 }
    - { requete: '["role":"brique"]',     couleur: "#412CDD", rgb: 4271325 }
    - { requete: '["role":"notion"]',     couleur: "#7AB800", rgb: 8042496 }
    - { requete: '["role":"comparatif"]', couleur: "#EF4444", rgb: 15680580 }
    - { requete: '["role":"pattern"] OR ["role":"rule"]', couleur: "#94A3B8", rgb: 9741240 }
  note_base: >
    Un `.base` NE SE COLORE PAS, et ce n est pas un oubli : il n a ni frontmatter
    ni corps, donc pas de `role:`, et aucune requete colorGroups ne peut l
    atteindre. Les 47 apparaissent dans la couleur par defaut, tenus par l unique
    arete de l embed de leur page. La page est le noeud qui compte.
  note_couleurs_heritees: >
    Le bleu et le vert sont EXACTEMENT ceux des anciennes galaxies `dev` et
    `wiki` : ce sont les memes pages, elles ne changent que de nom de champ.
  hors_graphe: "les pages de gouvernance sont exclues par `userIgnoreFilters`, pas par une couleur"

genere:
  chemins:
    - { chemin: "AI/index/", par: build_index }
    - { chemin: "zones AUTO des 74 hubs", par: build_mocs, balises: ["<!-- AUTO:START -->", "<!-- AUTO:END -->"] }
    - { chemin: "Métiers/", par: build_mocs }
    - { chemin: "Comparatifs/Comparatifs.md", par: build_mocs }
    - { chemin: "AI/index/liens.md", par: build_links }
    - { chemin: "bandeaux des 337 briques", par: build_bandeau, balises: ["<!-- AUTO:BANDEAU:START -->", "<!-- AUTO:BANDEAU:END -->"] }
    - { chemin: "Documentation/general/taxonomie.md", par: kit, depuis: axes }
    - { chemin: "Templates/", par: kit, depuis: "roles[].champs et roles[].corps" }
    - { chemin: "docs/", par: kit, depuis: "tout le manifeste" }
  contrat: >
    Ce qui est genere n est JAMAIS edite a la main, et se verifie : zone a
    balises dediees, remplacement en bloc, idempotence (zero octet ecrit si rien
    ne change), `--check` en code 2, preservation de la zone manuelle.
  non_pages:
    - .git
    - .claude
    - .obsidian
    - AI
    - Documentation
    - Templates
    - Projects
    - docs
    - MOC
  motif_non_pages: >
    Le perimetre s enumere PAR LA NEGATIVE : tout dossier de la racine qui n est
    pas de l outillage porte des pages. Aucune table de domaines a tenir a jour.
    `Templates/` en est exclu et doit le rester — ses gabarits portent un
    frontmatter d exemple a trous, dont un bandeau derive n aurait aucun sens.
  index:
    fichiers: ["AI/index/brain-index.json", "AI/index/brain-index.md"]
    champs: [nom, alias, role, categorie, famille, langage, domaines,
             pitch, tags, alternatives, complements, maturite]
    plus: [path]
    tri: stable
    horodatage: false
    motif: >
      Ordre stable et aucun horodatage : deux regenerations d un vault inchange
      produisent le meme octet, sans quoi le `diff` vide du critere d acceptation
      des generateurs serait impossible.
    # --- AJOUTE AU LOT 4 -----------------------------------------------------
    signature: "AI/scripts/build_index.py"
    motif_signature: >
      Ce que l artefact ANNONCE comme son producteur, dans son en-tete et dans la
      cle `generated_by` du JSON. C est une valeur d instance, pas de kit : une
      instance `kit.mode: branche` annonce `brainkit generer`, une instance
      `kit.mode: fige` annonce le chemin ou ses scripts ont ete copies. Le
      DevBrain annonce les siens, et c est TOUJOURS exact apres le lot 9 : ses
      quatre generateurs sont devenus des PONTS de vingt lignes qui appellent le
      kit, et `AI/scripts/build_index.py` reste le fichier qu on lance et donc
      celui qui produit l artefact. La signature dit la commande, pas le paquet
      qui fait le travail — c est pour cela qu elle est une valeur d instance.
    portee: "v2-only (réservoir v1 exclu)"
    motif_portee: >
      DETTE V1, declaree parce qu elle est dans le fichier du vault. La cle
      `scope` du JSON annonce un « reservoir v1 » qui vivait sous un dossier
      `Wiki/` supprime au lot 4 de la migration. Le kit ne porte PAS le code qui
      l alimentait (`V1_MARKERS`, `is_active_v2()`) : il porte la declaration
      qu un artefact du DevBrain la contient. Un brain neuf ne declare pas
      `portee:`, et la cle n est alors pas emise.
    groupes:
      # L ORDRE du document humain, et le titre de chaque groupe. Un role absent
      # de cette liste sort APRES les declares, sous son propre identifiant :
      # c est ce qui fait apparaitre les 74 hubs sous un `## hub` sans titre
      # redige, fait du vault et non oubli du generateur.
      - { role: brique,     titre: "Briques — ce qu'on déploie ou importe" }
      - { role: notion,     titre: "Notions — ce qu'il faut comprendre" }
      - { role: comparatif, titre: "Comparatifs — ce qui départage plusieurs briques" }
      - { role: pattern,    titre: "Patterns — architectures éprouvées" }
      - { role: rule,       titre: "Rules — règles transverses" }
  liens:
    fichier: "AI/index/liens.md"
    sections: [tags, liens_sortants, backlinks, a_creer]
    motif_a_creer: "Les liens NON RESOLUS sont un mecanisme de backlog qui vaut pour tout sujet."
    masque_du_graphe: true
    signature: "AI/scripts/build_links.py"     # AJOUTE AU LOT 4, cf. index.signature

  # --- AJOUTE AU LOT 4 -------------------------------------------------------
  # Les gabarits de phrase des documents generes. Le kit en porte un jeu par
  # defaut (`brainkit/generer/prose.py`, langue `fr`, aucune valeur d instance) ;
  # ce bloc en SURCHARGE quatre, et les quatre sont de la dette du DevBrain que
  # le kit n a aucune raison d heriter. Sans la surcharge, le critere du `diff`
  # vide tombait sur quatre lignes de dette ; en la portant dans le kit, toutes
  # les instances l heriteraient (§5.10).
  prose:
    index.entete:
      - "Document généré par `{signature}`. Ne pas éditer à la main."
      - "{pages} pages actives. Réservoir v1 (0 pages Wiki) : référence, non indexé."
    index.sans_valeur: "(sans catégorie)"
    liens.sans_page: "  — pas de page concept dédiée"
    liens.tags_sans_page: "**Tags sans page concept dédiée** (sujets candidats à créer) :"
  motif_prose: >
    Pourquoi ces quatre exactement. `index.entete` annonce un reservoir v1
    disparu, et dit « Document genere » la ou la carte des liens dit « Genere ».
    `index.sans_valeur` nomme le CHAMP accentue (« sans categorie ») que la
    derivation depuis `categorie` ne sait pas produire ; le defaut du kit rend
    « (sans domaine) », le libelle de l axe. Les deux dernieres disent « page
    concept », mot de la v2 pour ce que le vault appelle desormais une notion —
    le defaut du kit interpole le libelle du role `fonction: notion`.

propagation:
  enonce: >
    Le rayon de propagation d une insertion est le DOSSIER D ACCUEIL, plus ses
    HUBS PARENTS. Le voisinage d une page est `ls` de son dossier — il ne se
    devine plus.
  clause: >
    Une ligne sans objet se DECLARE sans objet, elle ne se tait pas.
  derivee: true
  motif_derivee: >
    Les six lignes ci-dessous ne sont pas six decisions : elles SE DERIVENT de la
    liste des roles. Un role `fonction: vue` -> une ligne vue ; un role
    `protege: true` -> une ligne notion ; les pairs = meme role dans le dossier.
    La table est donc GENEREE, pas ecrite.
  table:
    - { n: P1, cible: "le hub du dossier", trouve_par: "c'est le dossier d'accueil", par: genere }
    - { n: P2, cible: "les hubs parents", trouve_par: "remontée de chemin", par: genere }
    - { n: P3, cible: "la vue du dossier", trouve_par: "le fichier `fonction: vue` du dossier",
        par: "vue embarquée : automatique ; section écrite à la main : à écrire" }
    - { n: P4, cible: "la notion du dossier", trouve_par: "le fichier `fonction: notion` du dossier", par: "à écrire" }
    - { n: P5, cible: "les pairs", trouve_par: "les autres pages du même rôle dans le dossier", par: "à écrire, réciprocité obligatoire" }
    - { n: P6, cible: "les résumés réinjectés", trouve_par: "les champs à réciprocité des pairs", par: "script de resynchronisation" }

skills:
  capture:
    nom: enrichir-brain
    ecrit_dans_le_brain: true
    mode_lot: false
    motif_mode_lot: >
      §5.9, recommandation ecrite, point NON tranche : capturer dix a vingt unites
      d un meme dossier en une conversation, en n appliquant la propagation qu une
      fois a la fin. Absent du DevBrain, qui n a jamais eu a s amorcer.
    porte:
      - "la règle de propagation P1->P6, dérivée"
      - "le mode mise à jour et sa table des effets de bord (champ modifié -> consommateurs -> commande de vérification)"
      - "la vérification [V1] de la réinjection du résumé"
  cloture:
    nom: cloturer-brain
    ecrit_dans_le_brain: false
    etapes:
      - "régénérer les quatre artefacts dérivés"
      - "passer les DEUX validateurs au vert"
      - "vérifier la divergence avec la branche distante AVANT tout commit"
      - "committer et intégrer en fast-forward"
    motif: >
      SEUL endroit ou la politique git du vault est ecrite, a une exception
      declaree : la regle d IDENTITE vit aussi dans CLAUDE.md, parce qu elle doit
      etre lue a chaque conversation.
  exploitation:
    nom: planifier-projet
    ecrit_dans_le_brain: false
    livrable: "un cahier des charges sourcé qui contraint l'IA de développement en aval"
    archetypes: "Documentation/perso/archetypes.md"
    questions: "Documentation/general/questions-projet.md"
    filtre_eliminatoire: "champs[maturite].eliminatoire"
    forme: >
      Identifier l usage -> poser SEULEMENT les questions pertinentes ->
      interroger l index -> produire un livrable SOURCE qui contraint l aval.
      C est cette forme qui se transpose ; les archetypes et le format de
      candidature, non.

agent:
  racine: "AI/"
  sous:
    - { chemin: "design/", role: "les specs de reference" }
    - { chemin: "migration/", role: "un fichier par lot, avec ses *Remontees*" }
    - { chemin: "index/", role: "genere, ne pas editer a la main" }
    - { chemin: "sessions/", role: "resumes automatiques par le hook Stop" }
    - { chemin: "scripts/", role: "l outillage — sur une instance `kit.mode: branche`, les PONTS vers le kit plus les outils propres au vault ; sur une `kit.mode: fige`, le kit copie" }
    - { chemin: "backlog.md", role: "ce qui reste a faire" }
  motif_migration: >
    Le journal de lot n est PAS remplacable par de la configuration. `motif:`
    porte « pourquoi ce libelle » ; il ne porte pas les quatre paragraphes de la
    remontee qui l a produit. Le manifeste POINTE vers AI/migration/, il ne l
    absorbe pas.
  hook_stop: "écrit un résumé de session dans AI/sessions/"

# ==============================================================================
# racine — LES `.md` DE LA RACINE, DECLARES. Bloc ajoute au lot 5 (remontee 3 du
# lot 4). Ce sont des artefacts de SEMIS, pas des artefacts derives : aucun des
# quatre generateurs ne les produit, et le DevBrain n a AUCUN script qui les
# ecrive. Le besoin etait de les DECLARER, pas de les generer — le validateur lit
# tout `.md` de la racine pour son test d atteignabilite, sans qu aucun champ ne
# dise lesquels aiguillent.
#
# TRANSCRIPTION, pas prescription : le vault reel porte NEUF `.md` a sa racine
# (CHANGELOG, CLAUDE.md, CLAUDE-build.md, CLAUDE-project.md, CONTRIBUTING,
# Home, INSTALL, Inbox, README) plus un LICENSE sans extension. Deux seulement
# sont des PAGES au sens du vault, et une seule aiguille. Les autres sont des documents de depot — ils
# ne citent aucun hub, donc `page_atteignable` ne les lit pour rien, et le semis
# n a aucune raison de les poser.
# ==============================================================================
racine:
  porte_d_entree: Home.md
  pages:

    - fichier: Home.md
      titre: Accueil
      aiguille: true
      role_editorial: porte
      motif: >
        La seule page du vault qui cite les vingt hubs de domaine, les deux hubs
        ranges par role et le hub de ralliement des comparatifs. Sans elle, ils
        sont tous « atteignables depuis aucun hub » : ils n ont pas de parent, et
        seule la porte d entree les cite.

    - fichier: Inbox.md
      titre: Inbox
      aiguille: false
      role_editorial: capture
      motif: >
        Deja nommee dans `frontieres_d_ecriture.libre` — c est la seule page que
        l utilisateur ecrit seul. Elle n aiguille pas : elle ne cite aucun hub.

frontieres_d_ecriture:
  libre:
    - "AI/ hors index/"
    - "Inbox.md"
  sur_confirmation:
    - "toute page d'un rôle non protégé"
    - "Documentation/"
  sur_demande_explicite:
    - "toute page d'un rôle `protege: true`"
  jamais_a_la_main:
    - "les chemins de `genere`"
  jamais_sans_accord:
    - "une suppression de page"
  deplacement: "par `git mv`, JAMAIS par suppression + création — sinon l'historique de la page est perdu"
  motif: >
    La premiere frontiere se lit sur un CHEMIN, la seconde sur un CHAMP. Une page
    voisine d une unite, dans le meme dossier, sous le meme hub, peut etre une
    notion protegee — la regle change, l emplacement ne le dit pas. Donc lire le
    frontmatter avant d ecrire.
