# ==============================================================================
# devbrain.brain.yml — le manifeste du DevBrain, remplissage COMPLET
# ------------------------------------------------------------------------------
# Test de fidelite du lot 1 : si le manifeste ne sait pas redire DevBrain, il est
# faux. Ce fichier ne contient AUCUNE troncature — ni « … », ni « 17 autres sur le
# meme modele ». Chaque valeur est transcrite depuis le vault, en lecture seule,
# le 2026-09-07. Les six points que le manifeste ne sait pas redire sont en
# design/01-manifeste.md, section « Ce qui ne rentre pas ».
#
# Sources de chaque bloc, pour que la transcription soit verifiable :
#   roles[].champs        -> AI/scripts/check_brain.py  (REQUIRED, ALLOWED)
#   roles[].corps         -> MESURE sur les 765 pages du vault, PAS Templates/
#                            ni brain-v3.md §6-§9 (constat E4 : les deux sont
#                            en retard sur les pages qu ils decrivent)
#   axes.rangement        -> AI/scripts/arbo.py (DOM_LABEL, DOM_RATTACHE,
#                            SUB_LABEL, SEUIL) + Documentation/general/taxonomie.md
#   axes.nature           -> taxonomie.md, bloc ```famille + arbre F1->F9
#   axes.transverses      -> Documentation/general/themes.md
#   bandeau               -> AI/scripts/build_bandeau.py
#   regles                -> AI/design/brain-v3.md §10 + AI/migration/lot-8-durcissement.md
#   graphe                -> Documentation/perso/obsidian-graph.md (seule source :
#                            .obsidian/graph.json est gitignore)
#
# Les accents sont ecrits partout SAUF dans les commentaires YAML et les champs
# `motif:`, ou ils sont omis : le meme choix que design/00-cadrage.md, pour que le
# fichier traverse sans dommage un pipeline qui ne serait pas en UTF-8.
# ==============================================================================

manifeste: 1

# §5.1 — recommandation ecrite, point NON tranche : BrainKit est un generateur, et
# une instance porte la version du kit qui l a produite plus son mode. `branche` =
# le code vit dans le kit ; `fige` = le code a ete copie dans AI/scripts/ et
# l instance ne recevra plus de correctif.
kit:
  version: "0.1.0"
  mode: branche

brain:
  nom: DevBrain
  sujet: "Les briques et les notions du developpement data, ML et IA, rangees par domaine."
  langue: fr
  # §5.4 — `fr` est la SEULE valeur legale en v1. C est une limite ecrite, pas un
  # oubli : la prose generee sort de gabarits, et un gabarit se duplique par langue
  # le jour ou deux instances francaises tournent.
  volume_cible: 800
  # 337 briques + 297 notions + 47 comparatifs + 74 hubs + 5 patterns + 5 regles
  # = 765 pages mesurees le 2026-09-07, plus la marge. Cf. Remontee 1 du lot 1 :
  # 00-cadrage.md annonce 338/299/75/6/6, qui compte les 6 gabarits de Templates/.
  usage: perso
  profil: obsidian        # §5.5, recommandation : `obsidian` (tout) ou `nu` (sans .base)
  proprietaire:
    nom: floSa

git:
  identite:
    name: floSa
    email: florian_horellou@laposte.net
  domaines_refuses: [aosis.net]
  trailers_refuses: [Co-Authored-By]
  branche_principale: main
  motif: >
    Depot PERSO. Cinq commits ont deja ete signes avec l adresse pro et sont
    entres dans les contributeurs GitHub, d ou ils ne sortent pas sans reecriture
    d historique. La regle est ecrite dans CLAUDE.md parce que c est le seul
    fichier charge a CHAQUE conversation, au meme endroit et au meme moment que
    l annonce du harnais — une contre-instruction qui arrive apres coup arrive
    trop tard. Trois hooks la doublent mecaniquement : pre-commit et pre-push
    refusent un domaine interdit, commit-msg refuse un trailer, et pre-commit
    refuse de tourner si commit-msg n est pas installe sous le core.hooksPath
    EFFECTIF (le garde-fou du garde-fou).

# ------------------------------------------------------------------------------
# libelles — le vocabulaire visible. Seul endroit de BrainKit ou le mot « brique »
# existe. La prose generee (guides, skills, manuel) n emploie que ces mots.
# ------------------------------------------------------------------------------
libelles:
  unite:         { s: brique,     p: briques }
  notion:        { s: notion,     p: notions }
  vue:           { s: comparatif, p: comparatifs }
  hub:           { s: hub,        p: hubs }
  prescription:  { s: prescription, p: prescriptions }
  axe_rangement: { s: domaine,    p: domaines }
  axe_nature:    { s: famille,    p: familles }
  axe_transverse:
    # CORRIGE AU LOT 4 : « metier » -> « metier » accentue. L en-tete de ce
    # fichier ecrit les accents PARTOUT sauf dans les commentaires et les
    # `motif:` ; ce libelle y echappait, et il est le seul des huit. Le
    # generateur de hubs transverses l interpole dans la phrase d intro des
    # 6 pages de « Metiers/ » (« Axe metier **Data Science** … ») : sans
    # l accent, le critere du `diff` vide tombait sur six pages.
    domaines:    { s: métier,     p: métiers }

# ------------------------------------------------------------------------------
# roles — SIX entrees. `id` est le mot que floSa lit dans son vault ; `fonction`
# est ce sur quoi le kit raisonne. §5.3 : `fonction:` n est PAS indexee dans le
# frontmatter des pages (un champ derivable ne se stocke pas).
# ------------------------------------------------------------------------------
roles:

  # --- 1/6 -------------------------------------------------------------------
  - id: brique
    fonction: unite
    libelle: { s: brique, p: briques }
    range_par: axe
    protege: false
    pese_sur_le_seuil: true
    apparait_dans_le_hub: true
    couleur: "#412CDD"
    taille_avertissement: 90        # check_brain.SIZE_WARN["brique"]
    population: 337
    champs:
      requis: [role, nom, pitch, categorie]
      autorises: [role, nom, alias, pitch, categorie, famille, domaines,
                  licence_type, langage, os, hosted, scaling, maturite,
                  alternatives, complements, tags, url_docs, url_repo]
      conditionnels:
        - { champ: hosted,  si: "famille in [plateforme, saas, application]" }
        - { champ: scaling, si: "famille in [plateforme, saas, application]" }
      # §5.11 — recommandation ecrite, point NON tranche. Le vestige est porte par
      # le ROLE et non par le champ : `domaines:` est REQUIS sur une notion, il n
      # est un vestige que sur une brique. D ou `deprecies` ici, et non un
      # `deprecated: true` dans le dictionnaire `champs:`. Cf. Remontee 8.
      deprecies: [os, domaines]
      motif_deprecies: >
        Les gabarits `service` et `outil` ont fusionne au lot 2 : l union de leurs
        champs est la liste de la brique. `os` et `domaines` viennent d `outil`.
        Leur presence est un vestige, pas une intention. Autorises, absents du
        gabarit genere, comptes par la passe de mesure.
      motif_conditionnels: >
        R16. Mesure v2 : 177 fiches famille:paquet portaient une valeur d
        hebergement, et scaling:single-node etait pose sur 212 fiches — la valeur
        par defaut de tout ce qui n est pas distribue. Deux champs qui decrivent
        100 % des fiches ne discriminent rien. Une bibliotheque ne s heberge pas
        et ne scale pas.
      note_sens_de_la_condition: >
        CORRIGE AU LOT 2, boite 1. `si:` est une PERMISSION, pas une OBLIGATION :
        elle dit que le champ n existe QUE si la condition tient, jamais qu il est
        exige quand elle tient. La distinction n etait pas ecrite, et §2.7 du
        contrat disait meme l inverse (« le validateur ne saurait jamais quand
        l EXIGER »). Mesure du lot 2 : 98 briques portent `hosted:` et `scaling:`,
        119 sont d une famille hebergee — 21 briques des trois familles ne portent
        NI l un NI l autre, et LES VINGT-ET-UNE portent `os:` a la place
        (18 `application`, 2 `saas`, 1 `plateforme`). Lire `si:` comme une
        obligation aurait donc produit 42 fausses violations. Le contrat est
        corrige, et exprimer une VRAIE obligation conditionnelle demanderait un
        second champ, que ce lot ne cree pas — cf. rapport du lot 2, remontee 2.
    corps:
      - { titre: "<bandeau>", niveau: 0, genre: bandeau, mesure: 337 }
      - { titre: "Definition", titre_rendu: "Définition", niveau: 2, genre: prose,
          mesure: 337,
          doctrine: "Quatre a six lignes. La SEULE section ou la prose est permise." }
      - { titre: "Prendre si / Ecarter si", titre_rendu: "Prendre si / Écarter si",
          niveau: 2, genre: decision, mesure: 337,
          colonne_positive: "Prendre si", colonne_negative: "Écarter si" }
      - { titre: "Mise en oeuvre", titre_rendu: "Mise en œuvre",
          niveau: 2, genre: etiquetee, mesure: 337,
          obligatoires: [Installation, "Point d'entrée", Prérequis, Exécution, Coût],
          permises:     [Installation, "Point d'entrée", Prérequis, Exécution, Coût],
          mesure_etiquettes: "les 5 etiquettes sur 337/337 pages" }
      - titre: "Ecosysteme"
        titre_rendu: "Écosystème"
        niveau: 2
        genre: libre
        mesure: 333
        motif: >
          333 et non 337 : quatre briques ne portent AUCUNE section Ecosysteme,
          donc ni Alternatives ni Complements — imbalanced-learn, Obsidian,
          Ruff, Quarto. C est le seul titre de corps de brique qui ne soit pas a
          337/337. Fait du vault, rapporte, non corrige (interdiction du lot 1).
          Cf. Remontee 4.
      - titre: "Alternatives"
        niveau: 3
        genre: liste_liens
        champ: alternatives
        mesure: 324
        existe_si: "la brique a des voisines interchangeables à nommer — soit `alternatives:` est renseigné, soit la section écrit en clair qu'aucune n'est fichée"
        motif: >
          CORRIGE AU LOT 2, boite 1. Le lot 1 declarait la section sans condition
          alors qu il en portait deja la mesure : 324 sur 337. Le compte se
          decompose en 273 pages dont `alternatives:` est renseigne, plus 51 qui
          portent la section avec un champ VIDE — la forme que la regle 8
          recommande (« Aucune outillee dans le brain : l approche concurrente est
          [[X]] »), ou le lien EXPLIQUE au lieu de LISTER. Les 13 restantes n ont
          ni voisine ni rien a en dire. Le `champ:` seul surdeclarait donc un
          miroir strict du frontmatter, que le vault n a jamais tenu.
      - titre: "Complements"
        titre_rendu: "Compléments"
        niveau: 3
        genre: liste_liens
        champ: complements
        mesure: 103
        existe_si: "`complements:` est renseigné"
        motif: >
          CORRIGE AU LOT 2, boite 1. Declaree sans condition pour 103 pages sur
          337. Contrairement a sa voisine `Alternatives`, celle-ci EST le miroir
          exact de son champ : zero page porte la section avec un champ vide, zero
          page a un champ renseigne sans la section. La condition s ecrit donc sur
          le champ, et rien d autre.
      - { titre: "Ressources", niveau: 2, genre: etiquetee, mesure: 337,
          obligatoires: [],
          permises: [Documentation, Dépôt, Tutoriel, Article, Papier, Cours, Vidéo],
          mesure_etiquettes: "Documentation 329 · Dépôt 309 · Papier 3 · Article 1 ·
                              hors vocabulaire : Site 4, Poids 1 (= les 5 violations
                              de la regle 7, moitie Ressources)" }
      - { titre: "Voir aussi", niveau: 2, genre: liste_liens, champ: null,
          mesure: 337 }
      - titre: "Retours"
        niveau: 2
        genre: conditionnelle
        mesure: 0
        existe_si: "au moins une entree datee"
        forme: "- YYYY-MM-DD — <symptôme> : <correctif>."
        motif: >
          Mesure du lot 6, reverifiee le 2026-09-07 : ZERO entree datee sur 337,
          zero section creee. Ce n est pas un defaut de format, c est un fait
          sur l usage — la place a existe dix-huit mois sans etre alimentee. La
          garder est la bonne decision (genre conditionnelle), la MESURER est
          le travail du lot 8 du kit.
    motif: >
      Ce qu on deploie ou importe : service, outil, librairie. Fusion des gabarits
      `service` et `outil` de la v2 au lot 2 — l audit avait montre qu ils ne se
      distinguaient par rien (57 fiches de nature identique reparties 34/23 sans
      discriminant : Marimo, notebook a interface, etait `type: service` ; DBeaver,
      client a interface, `type: outil`).

  # --- 2/6 -------------------------------------------------------------------
  - id: notion
    fonction: notion
    libelle: { s: notion, p: notions }
    range_par: axe
    protege: true                   # <- la frontiere « memoire perso » (O4)
    pese_sur_le_seuil: true
    apparait_dans_le_hub: true
    couleur: "#7AB800"
    taille_avertissement: 200       # check_brain.SIZE_WARN["notion"]
    population: 297
    champs:
      requis: [role, nom, categorie, domaines]
      autorises: [role, nom, alias, categorie, domaines, tags]
    corps:
      - { titre: "Apercu", titre_rendu: "Aperçu", niveau: 2, genre: libre, mesure: 297 }
      - { titre: "Concepts cles", titre_rendu: "Concepts clés", niveau: 2,
          genre: libre, mesure: 297 }
      - titre: "Les maths, simplement"
        niveau: 2
        genre: conditionnelle
        mesure: 282
        existe_si: "la notion porte une formule a expliquer"
        motif: >
          282 sur 297, et le genre est donc `conditionnelle` et non `libre` :
          quinze notions n ont pas de maths a expliquer, et la section n a pas
          ete posee vide. C est le comportement voulu, mais brain-v3.md §7 la
          declare inconditionnelle — cf. Remontee 3.
      - { titre: "En pratique", niveau: 2, genre: libre, mesure: 297 }
      - titre: "Approches voisines & alternatives"
        niveau: 2
        genre: liste_liens
        champ: null
        mesure: 297
        motif: >
          Le titre REEL des 297 pages. brain-v3.md §7 et 00-cadrage.md §2.2
          ecrivent tous deux « Approches voisines » — le gabarit de la spec est
          en retard sur les pages, exactement le constat E4. Cf. Remontee 2.
      - { titre: "Pour aller plus loin", niveau: 2, genre: libre, mesure: 297 }
    motif: >
      Ce que floSa a compris et ecrit pour lui-meme. On y ajoute volontiers ; on
      n y reecrit pas sans qu il l ait demande. La frontiere est portee par le
      CHAMP `role:` et par lui seul — aucun dossier ne rassemble les notions
      depuis la cloture du lot 4 : elles sont melees aux briques, dans le dossier
      de leur domaine. Donc lire le frontmatter avant d ecrire.

  # --- 3/6 -------------------------------------------------------------------
  - id: comparatif
    fonction: vue
    libelle: { s: comparatif, p: comparatifs }
    range_par: axe
    prefixe_nom: "Comparatif - "
    protege: false
    pese_sur_le_seuil: false        # arbo.ROLES_HORS_SEUIL
    apparait_dans_le_hub: true
    couleur: "#EF4444"
    population: 47
    vue_embarquee:
      extension: ".base"
      moteur: "obsidian-bases"
      embed: "![[<meme nom>.base]]"
      genere: false
      motif_non_genere: >
        Les 47 filtres sont du CONTENU, pas un derive. Chacun porte une requete
        reglee a la main (role == "brique" ET categorie == …) et souvent une
        seconde vue metier (« Self-hostable », sur hosted.contains("self")). Le
        generateur en amorce un par dossier promu, avec le filtre evident et l
        ordre de colonnes par defaut, et s arrete la.
      colonnes_par_defaut: [nom, pitch, famille, licence_type, hosted, scaling, maturite]
    regle_de_categorie: majorite
    motif_regle_de_categorie: >
      Celle qui rassemble le plus de ses membres. Necessaire parce qu un
      comparatif enjambe volontiers deux valeurs — « Comparatif - Bases NoSQL »
      reunit MongoDB (database/document), Redis et Cassandra (database/cle-valeur),
      et il n existe pas de valeur « NoSQL » : le vocabulaire range par modele de
      donnees, pas par famille marketing. Repli quand les deux candidates menent
      a des dossiers dont l un est promu et l autre non : au niveau du domaine.
    hub_de_ralliement:
      dossier: "Comparatifs"
      lien_retour: "Voir aussi"
      groupe_par: "premier segment du chemin (le domaine, jamais le sous-domaine)"
      motif: >
        C est le lien retour qui fait la grappe. Un hub qui cite 47 pages sans qu
        aucune le cite ajoute un noeud et ne rassemble rien : la dispersion des
        rouges resterait entiere, avec une page de plus. Le dossier ne porte QUE
        sa page — les 47 restent dans le dossier des briques qu ils departagent,
        c est ce qui les rend trouvables par `ls` et la regle de propagation en
        depend.
    champs:
      requis: [role, nom, categorie]
      autorises: [role, nom, categorie, tags]
      motif: >
        Quatre champs, et pas un de plus. Ni famille: ni licence_type: — un
        comparatif ne se deploie pas. Pas de pitch: non plus : la ligne « On
        tranche sur : … » du corps le remplace, et elle n a pas a etre indexee.
    corps:
      - { titre: "<accroche>", niveau: 0, genre: prose,
          forme: "> On tranche sur : …" }
      - { titre: "<embed>", niveau: 0, genre: auto }
      - { titre: "Ce qui departage", titre_rendu: "Ce qui départage", niveau: 2,
          genre: liste_liens, champ: null, mesure: 47 }
      - { titre: "Voir aussi", niveau: 2, genre: liste_liens, champ: null,
          mesure: 47,
          motif: "Porte l unique lien retour vers le hub Comparatifs. Arrivee le 2026-09-06." }
    motif: >
      Departager des objets INTERCHANGEABLES, dont on choisit un. C est l intention
      qui ne se transpose pas hors du dev (rupture 1) ; la primitive — une page qui
      embarque une vue filtree sur l axe de rangement, plus une section ecrite a la
      main, plus un hub de ralliement avec lien retour — se transpose telle quelle.

  # --- 4/6 -------------------------------------------------------------------
  - id: hub
    fonction: hub
    libelle: { s: hub, p: hubs }
    range_par: axe
    porte_categorie: false
    protege: false
    pese_sur_le_seuil: false
    apparait_dans_le_hub: false      # un hub ne se liste pas dans son propre hub
    couleur: "#FF922B"
    population: 74
    repartition: "6 Métiers/ · 20 domaines · Patterns/ · Rules/ · Comparatifs/ · 45 sous-domaines promus"
    champs:
      requis: [role, nom, pitch]
      autorises: [role, nom, alias, pitch, domaines, tags]
      motif: >
        Pas de categorie: — un hub ne se range pas, il EST le rangement : son
        domaine est son chemin. Le hub de domaine herite du frontmatter de la
        notion chapeau qu il absorbe (alias, domaines, tags), d ou ces trois
        champs facultatifs. C est cette fusion qui a supprime la seule collision
        de nom du vault, « Bases de donnees ».
    corps:
      - titre: "Ce qu'il faut comprendre"
        niveau: 2
        genre: libre
        mesure: 71
        ecrit_a_la_main: true
        existe_si: "le hub porte un corps d'aiguillage écrit à la main"
        motif: >
          CORRIGE AU LOT 2, boite 1 — deux fois. Declaree sans condition pour
          71 hubs sur 74, et le `motif:` du role nommait les MAUVAIS trois. Les
          trois qui ne la portent pas, mesures : « Bases de donnees » et
          « Text-to-SQL », deux hubs de domaine qui ont absorbe une notion chapeau
          et gardent son corps de NOTION (`## Apercu`, `## Concepts cles`…), et
          « Metiers/Infrastructure & Ops », un hub transverse qui n a AUCUN corps
          ecrit — son unique contenu est sa zone AUTO. Le hub « Comparatifs »,
          que le lot 1 comptait parmi les trois, porte les deux sections.
      - titre: "Choisir"
        niveau: 2
        genre: libre
        mesure: 71
        ecrit_a_la_main: true
        existe_si: "le hub porte un corps d'aiguillage écrit à la main"
        motif: "Meme cas et memes trois hubs que la section precedente."
      - titre: "<AUTO>"
        niveau: 0
        genre: auto
        balises: ["<!-- AUTO:START -->", "<!-- AUTO:END -->"]
        perimetre: dossier
        motif_trois_formes: >
          CORRIGE AU LOT 2, boite 1 : les `sections[]` ci-dessous decrivent UNE
          forme de zone AUTO — celle d un hub d ARBRE, dont le perimetre est son
          dossier. Le vault en a TROIS, et le manifeste du lot 1 n en declarait
          qu une :
            - hub d ARBRE (67) — perimetre `dossier`, les six sous-sections ci-dessous ;
            - hub de RALLIEMENT (1, « Comparatifs ») — perimetre `role`, GROUPE par
              le premier segment du chemin : ses 12 sous-titres sont des libelles
              de domaine, pas des sections de gabarit (cf. roles[comparatif].
              hub_de_ralliement.groupe_par) ;
            - hub TRANSVERSE (6, « Metiers/ ») — perimetre `champ`, aucune
              sous-section : une phrase puis une puce par sous-hub.
          Les mesures ci-dessous sont comptees sur les 74 hubs et restent justes ;
          ce qui manquait est la FORME. `perimetre` enumere deja les trois valeurs
          (`dossier`, `champ`, `role`) : ce qui reste a trancher est de savoir si
          un rôle porte plusieurs gabarits de zone AUTO ou si la forme se derive
          de `hub_par_valeur` et de `hub_de_ralliement`. Le lot 4 le decide, pas
          celui-ci — cf. rapport du lot 2, remontee 1.
        tranche_au_lot_4: >
          LA FORME SE DERIVE DU PERIMETRE, ET LE PERIMETRE SE LIT SUR LE DOSSIER
          DU HUB. Un role ne porte donc qu UN gabarit de zone AUTO — celui-ci,
          la forme `perimetre: dossier` — et les deux autres formes ne sont pas
          des gabarits de role : ce sont les formes d un hub dont le dossier est
          declare AILLEURS, par l axe ou par le role qui le peuple
          (`axes.transverses[].dossier` -> forme `champ` ;
          `roles[].hub_de_ralliement.dossier` -> forme `role`). Rien de neuf
          n est declare pour la forme, et les 74 pages gardent le meme `role:` :
          trois gabarits sur le role auraient mis la meme information a deux
          endroits, defaut que le manifeste existe pour supprimer (constat E4).
          Cf. `design/04-generation.md`, arbitrage 1.
        sections:
          # `depuis:` est la lecture MACHINE de `source:`, ajoutee au lot 4 :
          # `source:` restait de la prose, et un generateur ne remplit pas une
          # sous-section sur une phrase. Vocabulaire ferme par le kit :
          # `sous_dossiers`, `role`, `vues`. L ORDRE de cette liste est l ordre
          # des sous-sections dans la page.
          - { titre: "Sous-domaines", source: "sous-dossiers portant un hub",
              depuis: sous_dossiers, separateur: " · ", mesure: 10 }
          - { titre: "Notions",     source: "role: notion du dossier",
              depuis: role, role: notion,     mesure: 39 }
          - { titre: "Briques",     source: "role: brique du dossier",
              depuis: role, role: brique,     mesure: 58 }
          - { titre: "Patterns",    source: "role: pattern du dossier",
              depuis: role, role: pattern,    mesure: 1 }
          - { titre: "Rules",       source: "role: rule du dossier",
              depuis: role, role: rule,       mesure: 1 }
          - titre: "Comparatifs"
            source: "fichiers *.base du dossier"
            depuis: vues
            mesure: 37
            motif: >
              La seule section qui ne lit PAS `role:` mais l extension des
              fichiers. Anomalie du code actuel, rapportee sans etre corrigee :
              depuis le lot 5 la page `role: comparatif` existe a cote du .base,
              et c est elle qui devrait etre listee. Cf. Remontee 5.
      - titre: "Notes"
        niveau: 2
        genre: libre
        mesure: 13
        ecrit_a_la_main: true
        hors_zone_auto: true
        existe_si: "le hub porte une note manuelle sous sa zone AUTO"
        motif: >
          Section manuelle preservee par le generateur, presente sur 13 hubs.
          CORRIGE AU LOT 2, boite 1 : elle etait declaree sans condition, ce qui
          faisait de 61 hubs sur 74 des pages incompletes. Une section presente
          sur 13 pages sur 74 est facultative par construction — c est la
          declaration qui manquait, pas les 61 sections.
    motif: >
      La page d un dossier, l aiguillage. 71 des 74 portent les deux sections
      d aiguillage ci-dessus ; les trois qui ne les portent pas sont nommes dans
      le `motif:` de « Ce qu il faut comprendre » — deux hubs de domaine qui ont
      absorbe une notion chapeau et gardent son corps de notion, plus le hub
      transverse « Infrastructure & Ops » qui n a aucun corps ecrit. Fait du
      vault, rapporte, non corrige.

